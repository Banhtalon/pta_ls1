<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PyLearn - Nền tảng ôn tập Python cho học sinh. 3 cấp độ: Basic, Advance, Intensive với lý thuyết trắc nghiệm và thực hành code.">
  <title>PyLearn - Học Lập Trình Python</title>
  
  <!-- Font: Inter + Fira Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Có thể ghi đè khi hai app được deploy ở hai domain khác nhau.
    window.LEARNING_APP_LINKS = window.LEARNING_APP_LINKS || {
      webBaseUrl: './web-learning/dist/'
    };
  </script>
</head>
<body>
  <!-- HEADER -->
  <header id="main-header">
    <div class="header-container">
      <a href="#/" class="logo">
        <span class="logo-icon">🐍</span>
        <span class="logo-text">PyLearn</span>
      </a>
      
      <nav class="main-nav">
        <a href="#/" class="nav-link active" data-nav="home">Trang chủ</a>
        <a href="#/basic" class="nav-link" data-nav="basic">Basic</a>
        <a href="#/advance" class="nav-link" data-nav="advance">Advance</a>
        <a href="#/intensive" class="nav-link" data-nav="intensive">Intensive</a>
        <a href="web-learning/dist/#/" class="nav-link" data-nav="web-learning">Học Web</a>
      </nav>
      <div class="header-actions auth-section">
        <button class="btn-login" id="btn-login">Đăng nhập</button>
      </div>
    </div>
  </header>
  
  <!-- MAIN CONTENT - Rendered by JS router -->
  <main id="app">
    <!-- Content will be rendered here by dashboard.js / lesson-list.js / lesson-detail.js -->
  </main>
  
  <!-- FOOTER -->
  <footer id="main-footer">
    <div class="footer-container">
      <p class="footer-copyright">© 2024 PyLearn Education. Nền tảng học Python cho học sinh.</p>
      <nav class="footer-links">
        <a href="#">Tài liệu học tập</a>
        <a href="#">Cộng đồng</a>
        <a href="#">Hỗ trợ</a>
      </nav>
    </div>
    <div class="footer-credit" style="text-align: center; margin-top: 16px; font-size: 0.85rem; opacity: 0.7;">
      Designed by Dương Quang
    </div>
  </footer>
  
  <!-- SCRIPTS -->
  <!-- Firebase SDK (v9 Compat - tương thích cú pháp cũ, dùng được trực tiếp trong browser) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Python Runner Controller -->
  <script src="js/python-runner.js"></script>
  
  <!-- CodeMirror Editor -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>
  
  <!-- Firebase Config (phải load sau Firebase SDK) -->
  <script src="js/firebase-config.js"></script>

  <!-- Course Structure Data -->
  <script src="js/data/course-structure.js"></script>
  
  <!-- Safe DOM utility -->
  <script src="js/safe-dom.js"></script>
  
  <!-- Auth (phải load trước router để router kiểm tra đăng nhập) -->
  <script src="js/auth.js"></script>

  <!-- Core Logic -->
  <script src="js/router.js"></script>
  <script src="js/progress-store.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/lesson-list.js"></script>
  <script src="js/lesson-detail.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/teacher-dashboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
